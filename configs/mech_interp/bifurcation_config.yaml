model:
  name: "qwen3-8b"
  model_id: "Qwen/Qwen3-8B"
  device: "cuda"
  dtype: "float16"

# Data source - use existing sweep results
data_source:
  sweep_dir: "results/sweeps/temperature_sweep"
  temperature: "0.6"  # Which temperature to analyze
  model_filter: "qwen3-8b"  # Filter for this model in sweep

# Analysis parameters
analysis:
  token_position: 16  # Which token to extract hidden state
  layer_idx: 10  # Which layer to analyze

# Output
output_dir: "mech_interp/bifurcation_results"
