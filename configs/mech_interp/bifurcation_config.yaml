model:
  name: "qwen3-8b"
  model_id: "Qwen/Qwen3-8B"
  device: "cuda"
  dtype: "float16"

# Data source - use existing sweep results
data_source:
  sweep_dir: "results/sweeps/temperature_sweep"
  temperature: "0.6"  # Which temperature to analyze
  model_filter: "qwen3-8b"  # Filter for this model in sweep

# Analysis parameters
analysis:
  problem_id: 24  # Problem ID to analyze (0-499 for MATH-500)
  n_samples: 100  # Total solutions to generate
  token_position: 16  # Which token to extract hidden state
  layer_idx: 10  # Which layer to analyze
  temperature: 0.6  # Sampling temperature
  max_new_tokens: 4096  # Maximum tokens to generate per solution

# Output
output_dir: "mech_interp/bifurcation_results"

# API configuration for solution generation (OpenRouter)
api:
  model_name: "qwen/qwen3-8b"  # Model to use for generation
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  max_workers: 15  # Number of threads for parallel generation
