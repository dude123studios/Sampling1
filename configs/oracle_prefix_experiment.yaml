# Configuration for Oracle Prefix Experiment
# This experiment tests how model performance improves when given prefixes
# of oracle/gold solutions at different token lengths

# Oracle solution file (generated by generate_oracle_solutions.py)
oracle_file: "data/oracle_solutions.json"

# Prefix token lengths to test
prefix_lengths: [0, 16, 32, 64, 128, 512]

# Target models to test (via OpenRouter)
target_models:
  - name: "qwen3-8b"
    model_name: "qwen/qwen3-8b"
  - name: "deepseek-qwen3-8b"
    model_name: "deepseek/deepseek-r1-0528-qwen3-8b"

# Sampling parameters
temperature: 0.6
max_new_tokens: 4096
top_p: 1.0

# Number of samples per problem per prefix length
num_samples: 1  # Can increase for more robust statistics

# Task configuration
task:
  name: "math"
  dataset: "HuggingFaceH4/MATH-500"
  split: "test"
  level_filter: null  # Use all levels, or set to 5 for hardest only

# Output directory
output_dir: "results/oracle_prefix"

# API configuration
api:
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
