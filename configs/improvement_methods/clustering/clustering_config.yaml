# Configuration for API-Based Clustering Experiment
# This experiment generates k prefixes via API, embeds them using qwen3-embedding-8b,
# clusters them using HDBSCAN, and continues generation from cluster representatives

# No filter criteria - we use all level 5 problems
# filter_criteria:
#   min_correct: 1
#   max_correct: 2

# Experiment parameters
k_values: [32]  # Number of prefixes to generate (sweep across these values)
l_values: [16]  # Prefix lengths in tokens (sweep across these values)

# Generation parameters
temperature: 0.6
max_new_tokens: 4096
top_p: 1.0

# Threading parameters (optimized for speed and stability)
# max_problem_workers: 20  # Problems processed in parallel (command line arg)
# max_api_workers_per_problem: 5  # API calls per problem (hardcoded in script)

# HDBSCAN clustering parameters
hdbscan:
  min_cluster_size: 2  # Minimum size of clusters
  min_samples: 1  # Minimum samples in neighborhood for core points

# Task configuration
task:
  name: "math"
  dataset: "HuggingFaceH4/MATH-500"
  split: "test"
  level_filter: 5  # Only use Level 5 (hardest) problems

# Output directory
output_dir: "results/improvement_methods/clustering"

# API configuration for generation and embedding (OpenRouter)
api:
  generation_model: "qwen/qwen3-8b"  # Model to use for prefix generation and continuation
  embedding_model: "qwen/qwen3-embedding-8b"  # Model to use for embedding generated text
  base_url: "https://openrouter.ai/api/v1"
  # API key will be read from OPENROUTER_API_KEY environment variable (.env file)
  # If not found, uncomment and set here: api_key: "your-openrouter-api-key-here"
