model:
  type: api
  provider: openrouter
  model_name: qwen/qwen3-8b
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
task:
  name: math
  dataset: DigitalLearningGmbH/MATH-lighteval
  split: test
  subset_level: Level 5
  metric: accuracy
method:
  name: baseline
  type: standard
  use_seed_prompt: true
  temperature: 0.0
  top_p: 0.95
  max_new_tokens: 4096
seed: 42
limit: 5
num_samples: 3
output_dir: results/${now:%Y-%m-%d}/${task.name}/${method.name}
debug: false
