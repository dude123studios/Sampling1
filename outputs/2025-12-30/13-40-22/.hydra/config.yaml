model:
  type: api
  provider: openrouter
  model_name: deepseek/deepseek-r1-distill-qwen-32b
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
task:
  name: math
  dataset: DigitalLearningGmbH/MATH-lighteval
  split: test
  subset_level: Level 5
  metric: accuracy
method:
  name: baseline
  type: standard
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 4096
seed: 42
limit: 50
num_samples: 10
output_dir: results/${now:%Y-%m-%d}/${task.name}/${method.name}/${now:%H-%M-%S}
debug: false
max_workers: 50
