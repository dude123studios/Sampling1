model:
  type: api
  provider: openrouter
  model_name: qwen/qwen3-8b
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
task:
  name: math
  dataset: DigitalLearningGmbH/MATH-lighteval
  split: test
  subset_level: Level 5
  metric: accuracy
method:
  name: pruning
  type: standard
  chunk_size: 64
  similarity_threshold: 0.9
  embedding_model: all-MiniLM-L6-v2
  temperature: 0.7
seed: 42
limit: 1
num_samples: 1
output_dir: results/${now:%Y-%m-%d}/${task.name}/${method.name}
debug: false
